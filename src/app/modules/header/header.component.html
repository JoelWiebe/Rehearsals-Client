<header class="header">
  <mat-toolbar class="header__content section--slant">
    <div class="content flex flex-row items-center space-x-1">
      <a routerLink="/" class="header__logo">
        <img src="assets/img/rehearsals-header-logo_all-white.png" alt="Rehearsals logo" style="
            max-height: 80px;
            max-width: 80px;
            margin-left: auto;
            margin-right: auto;
        ">
      </a>
      <span class="flex-1"></span>
      <app-header-links
        class="hidden lg:block"
        [user]="user"
        [location]="location"
      ></app-header-links>
      @if (roles.length > 0) {
        <app-header-account-menu [user]="user"></app-header-account-menu>
      }
      @if (!location) {
        <span class="lg:hidden">
          <button mat-icon-button (click)="showMobileMenu()" i18n-aria-label aria-label="Main menu">
            <mat-icon>menu</mat-icon>
          </button>
        </span>
      }
    </div>
  </mat-toolbar>
</header>
